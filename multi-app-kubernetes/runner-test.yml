
name: Test Self Hosted Runner

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test-runner:
    runs-on: self-hosted

    steps:
      - name: Test runner
        run: echo "GitHub Actions runner is working!"

      - name: Check Docker
        run: docker --version

      - name: Check Kubernetes
        run: kubectl version --client

      - name: Check Minikube
        run: minikube status

      - name: Check Kubernetes nodes
        run: kubectl get nodes

