apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: multi-app
spec:
  replicas: 2
  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: payment

  template:
    metadata:
      labels:
        app: payment

    spec:
      containers:
        - name: payment
          image: multi-payment:v1
          imagePullPolicy: IfNotPresent

          serviceAccountName: payment-sa
          automountServiceAccountToken: false

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

            env:
              - name: PYTHONDONTWRITEBYTECODE
                value: "1"

            volumeMounts:
               - name: tmp
                 mountPath: /tmp

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"

          ports:
            - containerPort: 5001

          volumes:
            - name: tmp
              emptyDir: {}

          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: multi-app
spec:
  type: ClusterIP
  selector:
    app: payment
  ports:
    - port: 5001
      targetPort: 5001
      protocol: TCP
