
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product
  namespace: multi-app
spec:
  replicas: 2
  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: product

  template:
    metadata:
      labels:
        app: product

    spec:
      containers:
        - name: product
          image: multi-product:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5002

          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 10
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: multi-app
spec:
  type: ClusterIP
  selector:
    app: product
  ports:
    - port: 5002
      targetPort: 5002
      protocol: TCP
