apiVersion: apps/v1
kind: Deployment
metadata:
  name: login
  namespace: multi-app
spec:
  replicas: 2

  # Keep previous deployment revisions for rollback
  revisionHistoryLimit: 5

  # Rolling update configuration
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: login

  template:
    metadata:
      labels:
        app: login

    spec:
      containers:
        - name: login
          image: multi-login:v1
          imagePullPolicy: IfNotPresent

          # CPU and memory resource management
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"

          ports:
            - containerPort: 5000

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: login-service
  namespace: multi-app
spec:
  type: ClusterIP
  selector:
    app: login
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
