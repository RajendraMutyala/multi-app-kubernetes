apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: multi-app
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: multi-frontend:v1
          imagePullPolicy: IfNotPresent
           resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: multi-app
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
      protocol: TCP
