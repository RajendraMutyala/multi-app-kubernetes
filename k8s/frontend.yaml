apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: multi-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend

          image: ghcr.io/rajendramutyala/multi-frontend:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          env:
            - name: LOGIN_URL
              value: "http://login-service:5000"

            - name: PRODUCT_URL
              value: "http://product-service:5002"

            - name: PAYMENT_URL
              value: "http://payment-service:5001"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: multi-app
spec:
  type: NodePort
  selector:
    app: frontend

  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
