apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: multi-app
spec:
  replicas: 3
  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      serviceAccountName: frontend-sa
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: frontend
          image: multi-frontend:v1
          imagePullPolicy: IfNotPresent

          # CPU and memory resource management
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"

          ports:
            - containerPort: 8000

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      # pod level: same indentation as "containers:"
      volumes:
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: multi-app
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
