apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: multi-app-ingress
  namespace: multi-app
spec:
  ingressClassName: nginx

  rules:
  - host: multiapp.local

    http:
      paths:

      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 8000

      - path: /login
        pathType: Prefix
        backend:
          service:
            name: login-service
            port:
              number: 5000

      - path: /product
        pathType: Prefix
        backend:
          service:
            name: product-service
            port:
              number: 5001

      - path: /payment
        pathType: Prefix
        backend:
          service:
            name: payment-service
            port:
              number: 5002
