apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-to-backends
  namespace: multi-app
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: login
      ports:
        - protocol: TCP
          port: 5000

    - to:
        - podSelector:
            matchLabels:
              app: product
      ports:
        - protocol: TCP
          port: 5002

    - to:
        - podSelector:
            matchLabels:
              app: payment
      ports:
        - protocol: TCP
          port: 5001
