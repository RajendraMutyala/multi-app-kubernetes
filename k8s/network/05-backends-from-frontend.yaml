apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backends-from-frontend-only
  namespace: multi-app
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - login
          - product
          - payment
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - protocol: TCP
          port: 5000
        - protocol: TCP
          port: 5002
        - protocol: TCP
          port: 5001
