
name: Build, Scan and Deploy Applications

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: Build, Scan and Deploy
    runs-on: self-hosted

    steps:
      # 1. Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Generate lowercase image prefix
      - name: Prepare Image Names
        id: image
        shell: bash
        run: |
          OWNER_REPO=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "prefix=ghcr.io/${OWNER_REPO}" >> "$GITHUB_OUTPUT"

      # 3. Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Login to GHCR
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Build and Push Frontend
      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.image.outputs.prefix }}-frontend:${{ github.sha }}

      # 6. Build and Push Login
      - name: Build and Push Login
        uses: docker/build-push-action@v6
        with:
          context: ./login
          push: true
          tags: ${{ steps.image.outputs.prefix }}-login:${{ github.sha }}

      # 7. Build and Push Payment
      - name: Build and Push Payment
        uses: docker/build-push-action@v6
        with:
          context: ./payment
          push: true
          tags: ${{ steps.image.outputs.prefix }}-payment:${{ github.sha }}

      # 8. Build and Push Product
      - name: Build and Push Product
        uses: docker/build-push-action@v6
        with:
          context: ./product
          push: true
          tags: ${{ steps.image.outputs.prefix }}-product:${{ github.sha }}

      # 9. Trivy Filesystem Scan
      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: table
          exit-code: '1'
          ignore-unfixed: true

      # 10. Trivy Frontend Image Scan
      - name: Trivy Frontend Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.prefix }}-frontend:${{ github.sha }}
          scan-type: image
          severity: HIGH,CRITICAL
          format: table
          exit-code: '1'
          ignore-unfixed: true

      # 11. Trivy Login Image Scan
      - name: Trivy Login Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.prefix }}-login:${{ github.sha }}
          scan-type: image
          severity: HIGH,CRITICAL
          format: table
          exit-code: '1'
          ignore-unfixed: true

      # 12. Trivy Payment Image Scan
      - name: Trivy Payment Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.prefix }}-payment:${{ github.sha }}
          scan-type: image
          severity: HIGH,CRITICAL
          format: table
          exit-code: '1'
          ignore-unfixed: true

      # 13. Trivy Product Image Scan
      - name: Trivy Product Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.prefix }}-product:${{ github.sha }}
          scan-type: image
          severity: HIGH,CRITICAL
          format: table
          exit-code: '1'
          ignore-unfixed: true

      # 14. Verify Cluster Connectivity
      - name: Verify Kubernetes Cluster
        run: |
          kubectl config current-context
          kubectl get nodes
          kubectl get namespaces

      # 15. Apply Kubernetes Manifests
      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f k8s/

      # 16. Update Frontend Image
      - name: Update Frontend Image
        run: |
          kubectl set image deployment/frontend \
          frontend=${{ steps.image.outputs.prefix }}-frontend:${{ github.sha }} \
          -n multi-app

      # 17. Update Login Image
      - name: Update Login Image
        run: |
          kubectl set image deployment/login \
          login=${{ steps.image.outputs.prefix }}-login:${{ github.sha }} \
          -n multi-app

      # 18. Update Payment Image
      - name: Update Payment Image
        run: |
          kubectl set image deployment/payment \
          payment=${{ steps.image.outputs.prefix }}-payment:${{ github.sha }} \
          -n multi-app

      # 19. Update Product Image
      - name: Update Product Image
        run: |
          kubectl set image deployment/product \
          product=${{ steps.image.outputs.prefix }}-product:${{ github.sha }} \
          -n multi-app

      # 20. Verify Rollout
      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/frontend -n multi-app
          kubectl rollout status deployment/login -n multi-app
          kubectl rollout status deployment/payment -n multi-app
          kubectl rollout status deployment/product -n multi-app

      # 21. Display Running Resources
      - name: Display Cluster Resources
        run: |
          kubectl get namespaces
          kubectl get deployments -n multi-app
          kubectl get services -n multi-app
          kubectl get pods -n multi-app
