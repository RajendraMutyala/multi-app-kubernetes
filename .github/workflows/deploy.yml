name: Build, Scan and Deploy Applications

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: Build, Scan and Deploy
    runs-on: self-hosted

    steps:

      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configure Docker Desktop Context
      - name: Configure Docker Context
        run: |
          docker context use desktop-linux
          docker context show
          docker info

      # 3. Generate Lowercase Image Names
      - name: Prepare Image Names
        id: image
        shell: bash
        run: |
          OWNER_REPO=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "prefix=ghcr.io/${OWNER_REPO}" >> "$GITHUB_OUTPUT"

      # 4. Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      # 5. Login to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Build Frontend Image
      - name: Build Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: ${{ steps.image.outputs.prefix }}-frontend:${{ github.sha }}

      # 7. Build Login Image
      - name: Build Login
        uses: docker/build-push-action@v6
        with:
          context: ./login
          load: true
          tags: ${{ steps.image.outputs.prefix }}-login:${{ github.sha }}

      # 8. Build Payment Image
      - name: Build Payment
        uses: docker/build-push-action@v6
        with:
          context: ./payment
          load: true
          tags: ${{ steps.image.outputs.prefix }}-payment:${{ github.sha }}

      # 9. Build Product Image
      - name: Build Product
        uses: docker/build-push-action@v6
        with:
          context: ./product
          load: true
          tags: ${{ steps.image.outputs.prefix }}-product:${{ github.sha }}

      # 10. Verify Local Docker Images
      - name: Verify Docker Images
        run: |
          echo "Current Docker context:"
          docker context show

          echo "Available Docker images:"
          docker images

          echo "Verifying all four images:"
          docker image inspect ${{ steps.image.outputs.prefix }}-frontend:${{ github.sha }}
          docker image inspect ${{ steps.image.outputs.prefix }}-login:${{ github.sha }}
          docker image inspect ${{ steps.image.outputs.prefix }}-payment:${{ github.sha }}
          docker image inspect ${{ steps.image.outputs.prefix }}-product:${{ github.sha }}

      # 11. Trivy Filesystem Scan
      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: table
          exit-code: '1'
          ignore-unfixed: true

      # 12. Trivy Frontend Image Scan
      - name: Trivy Frontend Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.prefix }}-frontend:${{ github.sha }}
          scan-type: image
          severity: HIGH,CRITICAL
          format: table
          exit-code: '1'
          ignore-unfixed: true

      # 13. Trivy Login Image Scan
      - name: Trivy Login Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.prefix }}-login:${{ github.sha }}
          scan-type: image
          severity: HIGH,CRITICAL
          format: table
          exit-code: '1'
          ignore-unfixed: true

      # 14. Trivy Payment Image Scan
      - name: Trivy Payment Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.prefix }}-payment:${{ github.sha }}
          scan-type: image
          severity: HIGH,CRITICAL
          format: table
          exit-code: '1'
          ignore-unfixed: true

      # 15. Trivy Product Image Scan
      - name: Trivy Product Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.prefix }}-product:${{ github.sha }}
          scan-type: image
          severity: HIGH,CRITICAL
          format: table
          exit-code: '1'
          ignore-unfixed: true

      # 16. Push Images to GHCR After Successful Scans
      - name: Push Images to GHCR
        run: |
          docker push ${{ steps.image.outputs.prefix }}-frontend:${{ github.sha }}
          docker push ${{ steps.image.outputs.prefix }}-login:${{ github.sha }}
          docker push ${{ steps.image.outputs.prefix }}-payment:${{ github.sha }}
          docker push ${{ steps.image.outputs.prefix }}-product:${{ github.sha }}

      # 17. Verify Kubernetes Cluster
      - name: Verify Kubernetes Cluster
        run: |
          kubectl config current-context
          kubectl get nodes
          kubectl get namespaces

      # 18. Apply Kubernetes Manifests
      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f k8s/

      # 19. Update Frontend Deployment
      - name: Update Frontend Image
        run: |
          kubectl set image deployment/frontend \
          frontend=${{ steps.image.outputs.prefix }}-frontend:${{ github.sha }} \
          -n multi-app

      # 20. Update Login Deployment
      - name: Update Login Image
        run: |
          kubectl set image deployment/login \
          login=${{ steps.image.outputs.prefix }}-login:${{ github.sha }} \
          -n multi-app

      # 21. Update Payment Deployment
      - name: Update Payment Image
        run: |
          kubectl set image deployment/payment \
          payment=${{ steps.image.outputs.prefix }}-payment:${{ github.sha }} \
          -n multi-app

      # 22. Update Product Deployment
      - name: Update Product Image
        run: |
          kubectl set image deployment/product \
          product=${{ steps.image.outputs.prefix }}-product:${{ github.sha }} \
          -n multi-app

      # 23. Verify Deployment Rollouts
      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/frontend -n multi-app --timeout=180s
          kubectl rollout status deployment/login -n multi-app --timeout=180s
          kubectl rollout status deployment/payment -n multi-app --timeout=180s
          kubectl rollout status deployment/product -n multi-app --timeout=180s

      # 24. Display Kubernetes Resources
      - name: Display Cluster Resources
        if: always()
        run: |
          kubectl get namespaces
          kubectl get deployments -n multi-app
          kubectl get services -n multi-app
          kubectl get pods -n multi-app
