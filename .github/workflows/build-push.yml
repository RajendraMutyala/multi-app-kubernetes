name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push All Applications
    runs-on: self-hosted

    steps:
      # Step 1: Download source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Convert repository name to lowercase
      - name: Prepare Image Names
        id: image
        shell: bash
        run: |
          OWNER_REPO=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "prefix=ghcr.io/${OWNER_REPO}" >> "$GITHUB_OUTPUT"

      # Step 3: Configure Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 4: Login to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 5: Build and push Frontend
      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.image.outputs.prefix }}-frontend:${{ github.sha }}

      # Step 6: Build and push Login
      - name: Build and Push Login
        uses: docker/build-push-action@v6
        with:
          context: ./login
          push: true
          tags: ${{ steps.image.outputs.prefix }}-login:${{ github.sha }}

      # Step 7: Build and push Payment
      - name: Build and Push Payment
        uses: docker/build-push-action@v6
        with:
          context: ./payment
          push: true
          tags: ${{ steps.image.outputs.prefix }}-payment:${{ github.sha }}

      # Step 8: Build and push Product
      - name: Build and Push Product
        uses: docker/build-push-action@v6
        with:
          context: ./product
          push: true
          tags: ${{ steps.image.outputs.prefix }}-product:${{ github.sha }}

      # Step 9: Display generated image names
      - name: Display Images
        run: |
          echo "All four Docker images have been pushed."
          echo "Image tag: $GITHUB_SHA"

      # Step 10: Update Frontend Deployment Image
      - name: Update Kubernetes Frontend
        run: |
          kubectl set image deployment/frontend frontend=${{ steps.image.outputs.prefix }}-frontend:${{ github.sha }} -n multi-app

      # Step 11: Update Login Deployment Image
      - name: Update Kubernetes Login
        run: |
          kubectl set image deployment/login login=${{ steps.image.outputs.prefix }}-login:${{ github.sha }} -n multi-app

      # Step 12: Update Payment Deployment Image
      - name: Update Kubernetes Payment
        run: |
          kubectl set image deployment/payment payment=${{ steps.image.outputs.prefix }}-payment:${{ github.sha }} -n multi-app

      # Step 13: Update Product Deployment Image
      - name: Update Kubernetes Product
        run: |
          kubectl set image deployment/product product=${{ steps.image.outputs.prefix }}-product:${{ github.sha }} -n multi-app
